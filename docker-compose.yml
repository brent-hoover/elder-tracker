services:
  postgres:
    image: postgres:15-alpine
    container_name: elder_tracker_db
    environment:
      POSTGRES_USER: elderuser
      POSTGRES_PASSWORD: elderpass
      POSTGRES_DB: eldertracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elderuser -d eldertracker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: