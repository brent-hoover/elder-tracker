[phases.setup]
nixPkgs = ["nodejs-18_x", "npm-9_x"]

[phases.install]
cmds = ["npm ci --workspaces --include-workspace-root"]

[phases.build]
cmds = [
    "echo 'Build env check - DATABASE_URL:' $DATABASE_URL",
    "npm run build:backend",
    "npm run build:frontend",
    "mkdir -p apps/backend/dist/src",
    "cp -r apps/frontend/dist apps/backend/dist/src/frontend",
    "echo '=== Checking build output ==='",
    "ls -la apps/backend/dist/src/",
    "echo '=== main.js file info ==='",
    "ls -la apps/backend/dist/src/main.js || echo 'main.js not found'",
    "echo '=== First lines of main.js ==='",
    "head -15 apps/backend/dist/src/main.js"
]

[start]
cmd = "pwd && ls -la && ls -la apps/backend/dist/src/ && cat apps/backend/dist/src/main.js | head -20"